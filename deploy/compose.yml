services:
  web:
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: budget-fr-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.budget-fr.rule=Host(`budget-fr.kiwinokoto.fr`)"
      - "traefik.http.routers.budget-fr.entrypoints=websecure"
      - "traefik.http.routers.budget-fr.tls=true"
      - "traefik.http.routers.budget-fr.tls.certresolver=letsencrypt"
      - "traefik.http.services.budget-fr.loadbalancer.server.port=80"
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
    name: traefik_network
